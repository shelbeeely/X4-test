; Xteink X4 (ESP32-C3) debug firmware — built via freeink-sdk.
; See README.md for how builds run (GitHub Actions only — no local toolchain
; required) and how to flash the resulting binaries over WebSerial.

[env:xteink_x4]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x) —
; pinned to the release freeink-sdk's own sample config verifies against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
; NOTE: board_build.merge_bin is an ESP-IDF-only PlatformIO feature and is a
; silent no-op on this Arduino-framework build (confirmed: no merged bin is
; produced). CI instead merges bootloader.bin (0x0) + partitions.bin (0x8000)
; + firmware.bin (0x10000) into firmware.merged.bin itself via `esptool.py
; merge_bin` — see .github/workflows/build.yml.

build_flags =
  -std=gnu++2a
  ; Xteink X4 has no separate USB-UART bridge: the ESP32-C3's native USB acts
  ; as the CDC serial console used for debug output and WebSerial monitoring.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFREEINK_DEVICE_X4=1
  ; Single framebuffer: the SSD1677's RAM holds the previous frame instead of
  ; a second host-side buffer. Keeps RAM pressure low on the ESP32-C3.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

build_unflags =
  -std=gnu++11

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
