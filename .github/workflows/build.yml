name: Build firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build xteink_x4 firmware
        run: pio run -e xteink_x4

      - name: List build output
        run: ls -la .pio/build/xteink_x4/

      # board_build.merge_bin is an ESP-IDF-only PlatformIO feature and is a
      # no-op on this Arduino-framework build, so merge explicitly: this is
      # what both the raw-artifact download and the Pages manifest flash.
      - name: Merge into a single flashable image
        run: |
          pip install esptool
          python -m esptool --chip esp32c3 merge_bin \
            -o .pio/build/xteink_x4/firmware.merged.bin \
            --flash_mode dio --flash_size 16MB \
            0x0 .pio/build/xteink_x4/bootloader.bin \
            0x8000 .pio/build/xteink_x4/partitions.bin \
            0x10000 .pio/build/xteink_x4/firmware.bin
          ls -la .pio/build/xteink_x4/firmware.merged.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xteink_x4-firmware
          path: |
            .pio/build/xteink_x4/*.bin
            .pio/build/xteink_x4/*.elf
          if-no-files-found: error

      # --- GitHub Pages flashing site (ESP Web Tools) -----------------------
      # Bundles the merged, single-offset binary + a manifest next to the
      # static web/ site so <esp-web-install-button> can flash it directly
      # over WebSerial. Packaged here so the firmware build above never
      # blocks on Pages state; the actual deploy is a separate job (below)
      # that needs Pages enabled once: repo Settings -> Pages -> Build and
      # deployment -> Source -> "GitHub Actions".
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p web/firmware
          cp .pio/build/xteink_x4/firmware.merged.bin web/firmware/firmware.merged.bin
          cat > web/firmware/manifest.json <<EOF
          {
            "name": "Xteink X4 Debug Firmware",
            "version": "${GITHUB_SHA::7}",
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  { "path": "firmware.merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # Separate job so a not-yet-enabled "github-pages" environment can only
  # ever block this deploy step, never the firmware build/artifact above.
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
